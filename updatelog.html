<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AquaGuide App Activity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body { background-color: #121212; font-family: 'Segoe UI', sans-serif; color: white; }
    .navbar.bg-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .sticky-controls {
      position: sticky; top: 0; z-index: 1020;
      background-color: rgba(18, 18, 18, 0.98);
      backdrop-filter: blur(10px); padding: 15px 0;
      border-bottom: 1px solid #333;
    }
    .controls-panel label { color: #a8c0ff; font-weight: bold; text-transform: uppercase; font-size: 0.7rem; }
    .form-control { background-color: #222 !important; border: 1px solid #444 !important; color: white !important; }
    .badge-date { background: linear-gradient(45deg, #ff416c, #ff4b2b); padding: 5px 10px; border-radius: 4px; }
    .badge-count { background: #4facfe; padding: 5px 15px; border-radius: 20px; }
    .text-info-vibrant { color: #00f260 !important; font-size: 0.9rem; }
    .table-dark { background-color: #1a1a1a; }
    #loader { text-align: center; padding: 50px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #00f260; border-radius: 50%; animation: spin 1s linear infinite; margin: auto; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-primary">
    <div class="container"><span class="navbar-brand font-weight-bold">AquaGuide Activity</span></div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
      <h1>User Activity</h1>
      <span class="badge badge-count">Total: <span id="totalCount">0</span></span>
    </div>
  </div>

  <div class="sticky-controls">
    <div class="container">
      <div class="row align-items-end">
        <div class="col-md-2 col-6"><label>Start</label><input type="date" id="startDate" class="form-control form-control-sm"></div>
        <div class="col-md-2 col-6"><label>End</label><input type="date" id="endDate" class="form-control form-control-sm"></div>
        <div class="col-md-3 mt-2"><label>Search</label><input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Device or menu..."></div>
        <div class="col-md-5 mt-2">
          <div class="btn-group w-100">
            <button class="btn btn-outline-info btn-sm" onclick="quickFilter('iPhone')">iPhones</button>
            <button class="btn btn-outline-info btn-sm" onclick="quickFilter('APP UPDATE')">Updates</button>
            <button class="btn btn-primary btn-sm" onclick="generateShareLink()">Share</button>
            <button class="btn btn-success btn-sm" onclick="exportToCSV()">CSV</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div id="loader"><div class="spinner"></div><p class="mt-2">Connecting to Firestore...</p></div>
    <div id="dataContainer" style="display:none;">
      <div class="table-responsive">
        <table class="table table-dark table-hover">
          <thead><tr><th>Time</th><th>Device</th><th>Menu Item</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/5.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/5.0.1/firebase-firestore.js"></script>

  <script>
    let allLogs = [], db;

    document.addEventListener("DOMContentLoaded", function() {
      initFirebase();
      initDateFilters();
      applyUrlFilters();
      setupEventListeners();
    });

    function initFirebase() {
      const config = { apiKey: "AIzaSyBu4FaHCylofeNVO5gHkyS4IYFcYZLOiA4", authDomain: "aquaguide2018.firebaseio.com", projectId: "aquaguide2018" };
      firebase.initializeApp(config);
      db = firebase.firestore();
      
      // FIX: Stop the "App May Break" warning
      db.settings({ timestampsInSnapshots: true });
      fetchData();
    }

    function initDateFilters() {
      const now = new Date();
      const past = new Date();
      past.setMonth(now.getMonth() - 3);

      // FIX: Format specifically as YYYY-MM-DD for the date input
      const fmt = (d) => d.toISOString().split('T');
      
      document.getElementById('startDate').value = fmt(past);
      document.getElementById('endDate').value = fmt(now);
    }

    function fetchData() {
      db.collection("users").orderBy("date", "desc").onSnapshot(snap => {
        allLogs = [];
        snap.forEach(doc => {
          const data = doc.data();
          // FIX: Handle both Date objects and Firebase Timestamps
          const d = data.date.toDate ? data.date.toDate() : new Date(data.date);
          allLogs.push({ 
            rawDate: d, 
            dateStr: d.toLocaleString(), 
            device: data.device || "Unknown", 
            visited: data.visited || "Unknown" 
          });
        });
        document.getElementById('loader').style.display = 'none';
        document.getElementById('dataContainer').style.display = 'block';
        renderTable();
      });
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const start = new Date(document.getElementById('startDate').value + "T00:00:00");
      const end = new Date(document.getElementById('endDate').value + "T23:59:59");

      const filtered = allLogs.filter(log => {
        if (log.rawDate < start || log.rawDate > end) return false;
        const text = (log.device + " " + log.visited).toLowerCase();
        return !search || text.includes(search);
      });

      document.getElementById('totalCount').innerText = filtered.length;
      let html = '';
      filtered.slice(0, 100).forEach(log => { // Showing first 100 for speed
        html += `<tr>
          <td><span class="badge badge-date">${log.dateStr}</span></td>
          <td class="small font-weight-bold">${log.device}</td>
          <td class="text-info-vibrant">${log.visited}</td>
        </tr>`;
      });
      document.getElementById('tableBody').innerHTML = html;
    }

    function quickFilter(v) { document.getElementById('searchInput').value = v; renderTable(); }
    
    function setupEventListeners() {
        ['searchInput', 'startDate', 'endDate'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderTable);
        });
    }

    function generateShareLink() {
      const s = document.getElementById('searchInput').value;
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      const url = `${window.location.origin}${window.location.pathname}?search=${encodeURIComponent(s)}&start=${start}&end=${end}`;
      navigator.clipboard.writeText(url).then(() => alert("Shared link copied!"));
    }

    function applyUrlFilters() {
      const p = new URLSearchParams(window.location.search);
      if (p.has('search')) document.getElementById('searchInput').value = p.get('search');
      if (p.has('start')) document.getElementById('startDate').value = p.get('start');
      if (p.has('end')) document.getElementById('endDate').value = p.get('end');
    }

    function exportToCSV() {
      let csv = "data:text/csv;charset=utf-8,Time,Device,Action\n";
      allLogs.forEach(l => csv += `"${l.dateStr}","${l.device}","${l.visited}"\n`);
      const link = document.createElement("a"); link.href = encodeURI(csv); link.download = "aqua_logs.csv"; link.click();
    }
  </script>
</body>
</html>
