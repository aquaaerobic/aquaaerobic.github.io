<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>1-Minute App Update Log</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .log-entry { margin-left: 10%; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .controls { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .count-header { font-size: 1.2em; margin-bottom: 15px; }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, getCountFromServer, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBu4FaHCylofeNVO5gHkyS4IYFcYZLOiA4",
            authDomain: "aquaguide2018.firebaseapp.com",
            projectId: "aquaguide2018",
            storageBucket: "aquaguide2018.firebasestorage.app",
            messagingSenderId: "333575317068",
            appId: "1:333575317068:web:5ab37f19fd58d8c96ab6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // March 30, 2026, 08:00:00 AM (Month is 0-indexed, so 2 = March)
        const startDate = new Date(2026, 2, 30, 8, 0, 0);

        async function loadData() {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "<center>Fetching latest logs...</center>";

            try {
                const tipsRef = collection(db, "users");
                const q = query(
                    tipsRef,
                    where("visited", "==", "APP UPDATE AVAILABLE - TAP HERE!"),
                    where("device", "==", "iPhone"),
                    where("date", ">", startDate),
                    orderBy("date", "desc"),
                    limit(1000)
                );

                const [querySnapshot, snapshot] = await Promise.all([
                    getDocs(q),
                    getCountFromServer(q)
                ]);

                const count = snapshot.data().count;
                let htmlContent = `<div class="count-header text-center"><center>iPhone app update count since 3/30/2026 8:00 AM is <b>${count}</b></center></div><br>`;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.date.toDate();
                    const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                    
                    htmlContent += `
                        <div class="log-entry">
                            <strong>Date:</strong> ${timeStr} | 
                            <strong>Device:</strong> ${data.device} | 
                            <strong>Page:</strong> ${data.visited}
                        </div>`;
                });

                resultsDiv.innerHTML = htmlContent;
            } catch (error) {
                console.error("Error loading data:", error);
                resultsDiv.innerHTML = `<center style="color:red;">Error loading logs. Check console for details.</center>`;
            }
        }

        // Attach function to window so the button can see it
        window.loadData = loadData;
        window.addEventListener("DOMContentLoaded", loadData);
    </script>
</head>
<body>
    <center>
        <h1>1-Minute App Update Log</h1>
        <div class="controls">
            <button onclick="window.loadData()">Refresh Log</button>
        </div>
    </center>
    <div id="results">Loading log...</div>
</body>
</html>
