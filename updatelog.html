<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>1-Minute App Update Log</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log-entry { margin-left: 10%; border-bottom: 1px solid #eee; padding: 8px; font-size: 14px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <center>
        <h1>1-Minute App Update Log</h1>
        <button id="refreshBtn">Refresh Log</button>
        <div id="results">Loading log...</div>
    </center>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, getCountFromServer, collection, query, where, orderBy, limit, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBu4FaHCylofeNVO5gHkyS4IYFcYZLOiA4",
            authDomain: "aquaguide2018.firebaseapp.com",
            projectId: "aquaguide2018",
            storageBucket: "aquaguide2018.firebasestorage.app",
            messagingSenderId: "333575317068",
            appId: "1:333575317068:web:5ab37f19fd58d8c96ab6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // March 30, 2026, 08:00:00 AM (local time)
        const jsDate = new Date(2026, 2, 30, 8, 0, 0); 
        const startTimestamp = Timestamp.fromDate(jsDate);
        console.log("Querying for dates after:", jsDate.toLocaleString());

        async function loadData() {
            const resultsDiv = document.getElementById("results");
            if (!resultsDiv) return;

            resultsDiv.innerHTML = "Fetching latest logs...";

            try {
                const tipsRef = collection(db, "users");
                
                // STEP 1: Simplified query to see if ANY iPhone updates exist
                // If this works, the issue is likely the Date range or the specific 'visited' string.
                const q = query(
                    tipsRef,
                    where("device", "==", "iPhone"),
                    where("date", ">", startTimestamp),
                    orderBy("date", "desc")
                );

                const querySnapshot = await getDocs(q);
                const snapshot = await getCountFromServer(q);
                const count = snapshot.data().count;

                let htmlContent = `<h3>Updates found: <b>${count}</b></h3><br>`;

                if (count === 0) {
                    htmlContent += "<p>No matches. Double check your Firestore field names (lowercase 'date'?) and the 'visited' string exactly.</p>";
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // We check the visited string manually here to debug
                    const matchStatus = (data.visited === "APP UPDATE AVAILABLE - TAP HERE!") ? "✅" : "❌";
                    
                    if (data.date) {
                        const dateObj = data.date.toDate();
                        htmlContent += `
                            <div class="log-entry" style="text-align: left;">
                                ${matchStatus} <strong>Date:</strong> ${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()} | 
                                <strong>Visited:</strong> ${data.visited}
                            </div>`;
                    }
                });

                resultsDiv.innerHTML = htmlContent;
            } catch (error) {
                console.error("Firestore Error:", error);
                // CRITICAL: Check the console for a link to create an index!
                resultsDiv.innerHTML = `<span style="color:red;">Error: ${error.message}</span><br><p>Check Browser Console for an Index Link.</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            document.getElementById("refreshBtn").addEventListener("click", loadData);
        });
    </script>
</body>
</html>
