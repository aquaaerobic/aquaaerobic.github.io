<script type="module">
    // Import the Firebase SDK modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, getCountFromServer, collection, query, where, orderBy, limit, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyBu4FaHCylofeNVO5gHkyS4IYFcYZLOiA4",
        authDomain: "aquaguide2018.firebaseapp.com",
        projectId: "aquaguide2018",
        storageBucket: "aquaguide2018.firebasestorage.app",
        messagingSenderId: "333575317068",
        appId: "1:333575317068:web:5ab37f19fd58d8c96ab6e9"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Create the JavaScript Date for March 30, 2026, 08:00 AM
    const jsDate = new Date(2026, 2, 30, 8, 0, 0); 
    
    // 2. Convert to Firebase Timestamp (Crucial for Firestore queries)
    const startTimestamp = Timestamp.fromDate(jsDate);

    async function loadData() {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "<center>Fetching latest logs...</center>";

        try {
            const tipsRef = collection(db, "users");
            
            // 3. Use the startTimestamp in the query
            const q = query(
                tipsRef,
                where("visited", "==", "APP UPDATE AVAILABLE - TAP HERE!"),
                where("device", "==", "iPhone"),
                where("date", ">", startTimestamp), // Changed from jsDate to startTimestamp
                orderBy("date", "desc"),
                limit(1000)
            );

            const [querySnapshot, snapshot] = await Promise.all([
                getDocs(q),
                getCountFromServer(q)
            ]);

            const count = snapshot.data().count;
            const TodaysDate = new Date();
            
            let htmlContent = `<center class="count-header">iPhone app update count since 3/30/2026 8:00 AM is <b>${count}</b></center><br>`;

            if (count === 0) {
                htmlContent += "<center>No records found after this timestamp.</center>";
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                // Ensure date exists before trying to convert
                if (data.date) {
                    const date = data.date.toDate();
                    const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                    htmlContent += `
                        <p style="margin-left: 10%; border-bottom: 1px solid #eee; padding: 5px;">
                            <strong>Date:</strong> ${timeStr}, 
                            <strong>Device:</strong> ${data.device}, 
                            <strong>Visited:</strong> ${data.visited}
                        </p>`;
                }
            });

            resultsDiv.innerHTML = htmlContent;
        } catch (error) {
            console.error("Firestore Error:", error);
            resultsDiv.innerHTML = `<center style="color:red;">Error: ${error.message}</center>`;
        }
    }

    window.loadData = loadData;
    window.addEventListener("DOMContentLoaded", loadData);
</script>
