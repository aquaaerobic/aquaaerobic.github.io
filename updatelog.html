<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>1-Minute App Update Log</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log-entry { margin-left: 10%; border-bottom: 1px solid #eee; padding: 8px; font-size: 14px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <center>
        <h1>1-Minute App Update Log</h1>
        <button id="refreshBtn">Refresh Log</button>
        <div id="results">Loading log...</div>
    </center>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, getCountFromServer, collection, query, where, orderBy, limit, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBu4FaHCylofeNVO5gHkyS4IYFcYZLOiA4",
            authDomain: "aquaguide2018.firebaseapp.com",
            projectId: "aquaguide2018",
            storageBucket: "aquaguide2018.firebasestorage.app",
            messagingSenderId: "333575317068",
            appId: "1:333575317068:web:5ab37f19fd58d8c96ab6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // March 30, 2026, 08:00:00 AM
        const jsDate = new Date(2026, 2, 30, 0, 0, 0); 
        const startTimestamp = Timestamp.fromDate(jsDate);

        async function loadData() {
            const resultsDiv = document.getElementById("results");
            
            // Safety check: Don't run if the div isn't on the page yet
            if (!resultsDiv) return;

            resultsDiv.innerHTML = "Fetching latest logs...";

            try {
                const tipsRef = collection(db, "users");
                const q = query(
                    tipsRef,
                    where("visited", "==", "APP UPDATE AVAILABLE - TAP HERE!"),
                    where("device", "==", "iPhone"),
                    where("date", ">", startTimestamp),
                    orderBy("date", "desc"),
                    limit(1000)
                );

                const [querySnapshot, snapshot] = await Promise.all([
                    getDocs(q),
                    getCountFromServer(q)
                ]);

                const count = snapshot.data().count;
                let htmlContent = `<h3>iPhone app update count since 8:00 AM: <b>${count}</b></h3><br>`;

                if (count === 0) {
                    htmlContent += "<p>No updates recorded yet today.</p>";
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date) {
                        const dateObj = data.date.toDate();
                        htmlContent += `
                            <div class="log-entry" style="text-align: left;">
                                <strong>Date:</strong> ${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()} | 
                                <strong>Device:</strong> ${data.device} | 
                                <strong>Action:</strong> ${data.visited}
                            </div>`;
                    }
                });

                resultsDiv.innerHTML = htmlContent;
            } catch (error) {
                console.error("Firestore Error:", error);
                resultsDiv.innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
            }
        }

        // Initialize on load and setup button
        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            document.getElementById("refreshBtn").addEventListener("click", loadData);
        });
    </script>
</body>
</html>
